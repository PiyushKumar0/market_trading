# config/settings.yaml — non-secret runtime config (paths, ports, schedules, feature flags).
#
# NOT a protected store. Secrets are NEVER here (they live in Windows Credential Manager).
# The trade_window below is only the SEED default; the live value is sticky in SQLite
# `trade_window_state` and owner-adjustable at runtime.

schema_version: 1
env: dev                                  # dev | prod (overridable via MT_ENV)
timezone: "Asia/Kolkata"                  # IST always; all scheduling tz-aware

paths:
  data_dir: "data"                        # overridable via MT_DATA_DIR
  duckdb: "data/market.duckdb"
  parquet_dir: "data/parquet"
  sqlite: "data/state.db"                 # WAL mode
  logs_dir: "data/logs"
  backups_dir: "data/backups"

api:
  host: "0.0.0.0"                         # binds LAN (phone login redirect needs LAN reachability)
  port: 8400                              # dashboard + Kite login callback
  # GET /kite/callback is the ONLY unauthenticated route; everything else needs the bearer token

ticker:
  tcp_host: "127.0.0.1"                   # loopback only, not routable (trust boundary)
  tcp_port: 8401                          # length-prefixed msgpack frames, 1 s heartbeat
  heartbeat_silence_kill_s: 10            # silence > 10 s => kill+respawn+stale-data guard
  max_instruments_per_conn: 3000
  tick_silence_degrade_s: 120             # in-session tick silence (heartbeats OK) => DEGRADED + alert
  tick_silence_respawn_s: 300             # in-session DEGRADED silence > this => respawn (silent connected feed;
                                          #   timed from the later of last tick / HEALTHY entry)
  max_tick_silence_respawns: 3            # tick-silence respawns per silence episode, then escalate ONCE (warning)
  feed_stats_interval_s: 300              # periodic in-session feed_stats INFO line cadence
  warming_timeout_s: 60                   # WARMING with no heartbeat > this => kill+respawn (sleep/resume wedge;
                                          #   also the generic system-resume recovery)
  warming_backoff_cap_s: 300             # consecutive WARMING-timeout respawns back off (60×2ⁿ), capped here
  max_wedge_respawns: 5                   # after this many consecutive wedge respawns => escalate ONCE (warning)
  keep_awake_in_session: true             # Windows: keep the OS awake while the NSE session is open (screen may sleep)

# Process-lifecycle notifications + liveness watchdog. Distinct from the ticker heartbeat above:
# this is the ENGINE's own liveness marker (SQLite engine_lifecycle.last_alive_at) read by the OUT-OF-BAND watchdog.
lifecycle:
  heartbeat_write_s: 20                   # engine writes last_alive_at this often (HeartbeatWriter thread, ops/heartbeat.py)
  down_stale_s: 90                         # watchdog: intend_to_run true AND heartbeat older than this => ENGINE_DOWN
                                          #   (> 3× heartbeat_write_s so a single slow tick never false-alarms)
  watchdog_poll_s: 60                     # scripts/watchdog.py Scheduled-Task cadence (non-wake)
  notify_planned_stop: true               # send ENGINE_STOPPED on a clean/planned stop (owner chose: notify both)
  notify_started: true                    # send ENGINE_STARTED immediately on boot
  active_period_starts: ["08:00"]         # expected active-period starts (IST); watchdog raises
                                          #   SCHEDULED_START_MISSED past start_grace_s
  start_grace_s: 900                      # grace after an expected start before the missed-start alert
  catchup_grace_s: 900                    # startup catch-up budget before FROZEN escalation alerts
  crashloop_window_s: 600                 # fast respawns inside this window => ENGINE_CRASHLOOP

broker:
  kite_login_redirect_path: "/kite/callback"   # MUST match the Kite app registered redirect URL;
                                               # documentation only — the route is hard-coded in kite_callback.py
  token_expiry_ist: "06:00"               # [RE-VERIFY: 06:00 vs forum 07:30]; NOT read by code —
                                          # token_valid() is driven off last successful call / 403s, NOT a hard clock
  instruments_refresh_ist: "08:15"        # NOT read by code; the schedule is jobs.instruments_ist

# SEED default for the owner-set daily trade window. Live value is sticky in
# SQLite, owner-adjustable via /trade_window and POST /config/trade_window.
trade_window:
  start_ist: "10:00"
  end_ist: "10:30"
  squareoff_buffer_min: 5                 # MIS entries cut off at end − buffer; force-flat by end

telegram:
  # The owner's Telegram chat ID (NOT a secret — just an integer ID). Inbound commands are accepted
  # ONLY from this chat ID. The bot TOKEN is a secret (Credential Manager). 0 = not configured
  # yet (the engine starts without Telegram and warns).
  owner_chat_id: -5586756347

clock:
  ntp_servers: ["time.windows.com", "pool.ntp.org"]
  max_skew_s: 2                           # > 2 s => no new entries until resync; mirrors limits.clock_skew
  calendar_horizon_alert_sessions: 40     # CALENDAR_HORIZON alert when fewer verified sessions remain

recommend:
  gtt_limit_offset_pct: 1.0
  veto_window_sessions: 3
  protection_first_reminder_min: 30
  reminder_window_start: "08:00"
  reminder_window_end: "22:00"

paper:
  subsystem_enabled: true                 # the autopilot stays OFF until turned ON
  seed: 20261006
  exit_minutes_before_close: 10
  exit_working_timeout_min: 5
  # No-stop test: paper positions of these strategies open with no stop and no target
  # and sell near the close (exit_minutes_before_close) of their 20th session; a fill whose exit date is past the
  # loaded calendar keeps its stop. This list drives the paper
  # (P) part only, and changing it restarts (P). [] plus a restart ends it for new positions; open ones run to
  # their exit session. Cards keep their stops.
  no_stop_strategies: [hi52, ins, brk20]

data:
  # Kite minute candles ARE corp-action adjusted (verified against a BSE 2:1 bonus), so the
  # backfill / bar-stitching job needs NO re-adjustment of Kite minute history across ex-dates.
  minute_candles_adjusted: true
  universe_max_watchlist: 300            # active intraday watchlist cap [tunable] (max_instruments_per_conn is not the binding constraint)
                                          # The eligible set is wider than this cap, so it BINDS by design: the tick watchlist
                                          # is the top N eligible by traded value, the rest audit as watchlist_cap. Raising
                                          # it is a separate, measured step (tick volume, bar building and per-minute feature
                                          # snapshots all scale with it); the first boot after a raise backfills 1m history
                                          # for the newly watched symbols (historical-rate throttled - longer warm-up that
                                          # morning). Owner chose to keep 300: names added by a wider index reach the batch
                                          # legs and the gate, not the tick feed.
  min_median_traded_value_inr: 50000000   # ₹5cr median 20d traded value [tunable]
  backfill_daily_years: 2
  backfill_minute_years: 1
  batch_universe_enabled: true            # Extended leg: criteria-passing NON-index symbols persisted included=False,
                                          # exclusion_reasons=['not_in_index'] — batch rules / news shadow /
                                          # pre-open advisory only; tick watchlist + risk gate stay scoped to
                                          # the configured index (universe.index_name).
                                          # false = exact universe shape without the extended leg (the rollback line).
  batch_universe_max: 600                 # top-N extended by median traded value (sanity cap)

# --- News-intelligence layer — owner-only operational config; changes audited (config_audit) ---
news:
  # Feed set (NewsIngest). `rss` is an open name -> {url, poll_s} map: one scheduler job per
  # entry, so adding/removing a source is a settings edit, not a code change. Headline-level only;
  # bodies never fetched. Corroboration (cat's min_source_domains:2) counts distinct DOMAINS, so
  # both livemint feeds are one domain, both hbl feeds one, both bs feeds one. Dead or blocked
  # feeds (Moneycontrol frozen, financialexpress malformed XML, businesstoday undated) stay out.
  feeds:
    rss:
      et:
        url:    "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
        poll_s: 300                                                                          # 5-min cadence
      livemint_markets:
        url:    "https://www.livemint.com/rss/markets"
        poll_s: 900                                                                          # 15-min, polite
      livemint_companies:
        url:    "https://www.livemint.com/rss/companies"
        poll_s: 900                                                                          # 15-min, polite
      hbl_markets:
        url:    "https://www.thehindubusinessline.com/markets/feeder/default.rss"
        poll_s: 900
      hbl_companies:
        url:    "https://www.thehindubusinessline.com/companies/feeder/default.rss"
        poll_s: 900
      cnbctv18_market:
        url:    "https://www.cnbctv18.com/commonfeeds/v1/cne/rss/market.xml"
        poll_s: 900
      ndtvprofit:
        url:    "https://feeds.feedburner.com/ndtvprofit-latest"
        poll_s: 900
      bs_markets:
        url:    "https://www.business-standard.com/rss/markets-106.rss"
        poll_s: 900
      bs_companies:
        url:    "https://www.business-standard.com/rss/companies-101.rss"
        poll_s: 900
      # Global outlets (owner, 2026-11-11: "Add global news channel"), so Fed decisions, wars and oil reach the
      # News Analyst first-hand instead of only as Indian outlets retell them. Picked from a 34-feed probe on
      # 2026-11-11 for current RSS 2.0 items: WSJ and MarketWatch feeds were stale since 2025, Nikkei and DW
      # empty, Yahoo malformed, Al Jazeera ~130 general items a day. About 160 items a day in all.
      bloomberg_markets:
        url:    "https://feeds.bloomberg.com/markets/news.rss"
        poll_s: 900
      bloomberg_economics:                                                                   # central banks, data
        url:    "https://feeds.bloomberg.com/economics/news.rss"
        poll_s: 900
      cnbc_world:
        url:    "https://www.cnbc.com/id/100727362/device/rss/rss.html"
        poll_s: 900
      cnbc_energy:                                                                           # oil, Gulf supply
        url:    "https://www.cnbc.com/id/19836768/device/rss/rss.html"
        poll_s: 900
      ft_world:
        url:    "https://www.ft.com/rss/home/international"
        poll_s: 900
      bbc_world:                                                                             # wars, geopolitics
        url:    "https://feeds.bbci.co.uk/news/world/rss.xml"
        poll_s: 900
      fed_monetary:                                                                          # FOMC statements
        url:    "https://www.federalreserve.gov/feeds/press_monetary.xml"
        poll_s: 900
    gdelt_doc_query:  "sourcecountry:IN (markets OR stocks OR earnings OR NSE)"               # DOC 2.0 query [VERIFY]
    # The EXCHANGE as a feed: NSE corporate-announcements, fetched
    # through the shared nse_http client. Items carry `symbol` natively, so each becomes a news row
    # titled "[NSE:<SYMBOL>] <subject>: <text>" that EntityResolver resolves exactly (never an alias
    # guess), with source_domain nseindia.com — ONE corroborating domain, never two.
    nse_announcements:
      enabled: true                # owner off switch: false = no fetch and no scheduler job
      poll_s: 300                  # the exchange disseminates all day; 5-min cadence
      drop_subjects:               # case-insensitive SUBSTRING match on the item's subject (`desc`)
        - "Trading Window"                          # routine PIT compliance window notices
        - "Loss of Share Certificate"               # registrar administrivia
        - "Compliances-Certificate"                 # periodic compliance certificates
        - "Newspaper Publication"                   # catches NSE's "Copy of Newspaper Publication"
        - "Analysts/Institutional Investor Meet"    # meeting schedules, not the outcome
        - "Change in Registrar"
        - "Book Closure"
  cluster_sim_threshold: 0.75    # Pinned clustering similarity [tunable, owner] — drives the
                                 # corroboration count, so owner-only (never in envelope.yaml)
  gdelt_poll_s: 3600             # GDELT DOC 2.0 poll cadence (GDELT 429s are not cadence-shaped;
                                 # only the pre-open digest needs it)
  request_timeout_s: 30          # per-fetch HTTP timeout (GDELT needs more than 10 s)
  backfill_lookback_h: 72        # off-period startup headline backfill window
  gdelt_backfill_max_days: 90    # GDELT DOC ~3-month window — no deeper backfill dependency

cat:
  fanout_weight: 0.5             # sector/theme fan-out multiplier on materiality AND |sentiment|
                                 # before threshold comparison. Owner-only, deliberately NOT learnable.
  # --- `cat` v2 SHADOW scanner knobs. ins-mechanics mirror.
  # Deliberately NO expected_edge_pct: there is no validated edge (the shadow measures it), so the
  # cost gate fail-closed-rejects every cat candidate — signals are journalled at prescreen
  # admission, nothing reaches RECOMMEND. Adding the edge key is the owner gate, post-verdict.
  stop_pct: 5.0                  # disaster stop; overnight_gap_mult arithmetic (the ins 5% reasoning)
  hold_sessions: 20              # = the swing max_holding cap; exit is TIME, target is None

# `cat_reversal` SHADOW — story-level directional REVERSAL as
# its own catalyst: the winning cluster of a (symbol, event_type) story reverses an EARLIER,
# floor-clearing, opposite-direction cluster of the same story. Separate experiment from `cat` v2,
# with its own pre-registered horizons (T+5 / T+10), its own clock and its own knobs — deliberately
# NOT sharing `cat.stop_pct`, so tuning one can never silently move the other.
#
# Entries count against the SAME catalyst_guard.max_catalyst_entries_day budget `cat` uses (the cap
# keys off the candidate's catalyst_ref, not its strategy_id) — adding a strategy must not widen the
# platform's total news-originated exposure surface. No expected_edge_pct: registered instead in the
# gate's no_edge_shadow_strategies, so the cost gate rejects every candidate whatever target the analyst emits.
cat_reversal:
  stop_pct: 5.0                  # disaster stop; overnight_gap_mult arithmetic (the ins reasoning)
  hold_sessions: 10              # intended exit if the owner gate ever opens = the longer horizon (T+10);
                                 # INERT during the shadow — nothing is ever held

# Corporate-filings event thresholds — OWNER-ONLY, deliberately NOT learnable (no new
# envelope-learnable parameters in stages 1–2). Research/validation inputs only: read by scripts
# (event_study, filings_experiments, validate_insider, research_common), never by a live decision
# path. The live insider leg is `ins` below; its floor is ins.threshold_inr (keep it equal).
filings:
  insider_min_value_inr: 10000000    # abs ₹ floor for an insider_net_buy event (₹1cr)
  insider_min_value_over_adv: 0.05   # NOT applied anywhere: the validated rule (live as `ins`) uses
                                     # the absolute floor only (an AND ADV floor was planned)
  pledge_delta_min_pct: 5.0          # QoQ promoter-pledge %-point change to flag

# `ins` — insider net-BUY swing leg, the first EVIDENCE-FIRST origination rule.
# OWNER-ONLY knobs, not in the learnable envelope.
#
# Validated under DISCLOSURE-date anchoring (never the insider's transaction date), next-session-OPEN
# fills, the spread-inclusive CNC cost surface and the margin floor on the CPCV stage: T+10 +0.7297% /
# T+20 +1.5797% net. It is the ONLY recorded edge that survived.
#
# Caveats:
#   * Live crossings come from the BSE FRESH feed (~13-18 in-universe rows/day) and NSE's PIT V2.0
#     route. The live-reachable event population is NOT proven identical to the backtested one. The
#     ins_crossings job logs fresh-feed row counts every run — sustained zero-rows is
#     STARVATION, not absence of signal.
#   * The CPCV pass is boundary-exact: 60.0% of folds against a 60% bar, one fold from failure.
#   * The survivorship / index-membership bound is uncorrectable with stored data.
ins:
  stop_pct: 5.0                # DISASTER stop, a deliberate deviation from the stopless validated
                               # design: sizing needs a risk distance, so one must exist. The
                               # overnight_gap_mult charges every swing unit 2.0× its stop distance, and
                               # the DP flat charge makes WIDER stops WORSE: at the ₹40,000 base all of
                               # the future [4-8] envelope range clears the cost gate (ins edge 1.58);
                               # at ₹20,000 only [4-6] did. Re-choosing it is an owner decision.
  hold_sessions: 20            # = the max_holding swing cap (limits.yaml swing_trading_days: 20)
                               # = exactly the validated T+20 horizon, so the EXISTING max-holding
                               # machinery IS the exit path. No new exit code exists for `ins`.
                               # FUTURE envelope row [10-20] — static owner knob.
  threshold_inr: 10000000      # ₹1cr trailing-10-session open-market insider net-BUY floor.
                               # OWNER-FIXED and NEVER learnable: this threshold DEFINES the validated
                               # event population — moving it re-opens multiplicity.
  expected_edge_pct: 1.58      # the validated T+20 NET drift, fed to the cost gate. `ins` ships
                               # target: None (the T+20 median +1.21% is INFORMATION, never an order
                               # level), so the gate cannot derive an edge from the levels — this is
                               # the per-strategy input it uses instead. At swing-position sizing (notional <=
                               # equity x 2% / (2.0 x 5%) = equity/5, ₹8,000 at the ₹40,000 base) the
                               # CostModel CNC round trip is ~0.43% => edge multiple ~3.6x (~3.5x at
                               # the ₹36,000 floor rung). The exact CostModel
                               # adjudicates per candidate; small notionals may be shrunk or rejected,
                               # and that is the gate doing its job.

# `hi52` — 52wk-high-proximity swing v2, a FORWARD TEST with a written kill rule
# (`scripts/hi52_forward_verdict.py` is the verdict). The rule's own parameters (incl. v2's
# smooth/gap thresholds) live in hi52.DEFAULT_PARAMS, frozen by pre-registration — only the edge is config.
hi52:
  expected_edge_pct: 1.53      # the cost-gate edge basis for a targetless proposal, the `ins` seam. NOT a
                               # net-drift transcription: DERIVED, and by ONE formula that lives in
                               # code — scripts/hi52_forward_verdict.py `registered_edge_pct()`,
                               # which a unit test pins against THIS key, so the two cannot drift.
                               #   edge = measured T+20 median GROSS - CostModel.breakeven_pct(N)
                               #   N    = equity x per_trade_risk.swing_position_pct/100
                               #          / (per_trade_risk.overnight_gap_mult x stop_pct/100)
                               # GROSS = +2.0336% (v2 discrete run, n=1,794 —
                               # data/reports/backtest_hi52_v2_2026-09-09.json, geometry block).
                               # N is not chosen, it is implied by swing-position sizing: a swing position is
                               # capped at 2.0% of equity charged at 2.0x the stop distance, and hi52's
                               # stop is 6%, so N <= equity x 2% / (2.0 x 6%) = equity/6 — Rs 6,000 at the
                               # equity_floor_rung (Rs 36,000, the
                               # SMALLEST equity the risk table still lets a position be opened at:
                               # below it the platform goes flat + CLOSE_ONLY). The floor RISES as
                               # the book shrinks, and this key is a
                               # constant read for months, so it is derived at the WORST permitted
                               # book rather than at today's: 2.0336 - 0.4982 = 1.5354 => 1.53,
                               # ROUNDED DOWN (rounding an edge up is the one direction that buys a
                               # candidate a cost-gate pass it did not earn). Deliberately NOT the
                               # backtest's own +1.71% net: it charged 0.3192% at a Rs 20,000
                               # reference size this book never trades. OWNER-SET, NEVER
                               # learner-movable (the `ins` pattern): this number is what the
                               # cost-gate check multiplies against the cost floor, so a learner allowed to
                               # raise it could buy any candidate a pass. DEMOTION under the kill
                               # rule is TWO edits in one owner-visible commit, both or neither:
                               # (1) re-add hi52.STRATEGY_ID to ops.main.NO_EDGE_SHADOW_STRATEGIES
                               # and (2) DELETE this key. Either alone leaves a half-promoted rule.
                               # Edit (2) BITES: Hi52Cfg.expected_edge_pct defaults to None, so an
                               # absent key un-registers the edge instead of falling back to a
                               # number in code.

# `brk20` — the ENTRY MECHANISM, not the rule. The rule's own parameters live in
# brk20.DEFAULT_PARAMS (frozen code defaults: envelope.yaml has no brk20 rows today; they are
# listed as future envelope rows) and the stop-geometry floor in
# brk20.FLOOR_PARAMS (owner-only by construction); this block holds how long the broken level is
# offered for and the regime gate on origination.
brk20:
  retest_sessions: 5           # TRADING sessions the broken level is offered on, counting signal_d (y+1,
                               # the session after the crossing y): it may be RE-PUBLISHED on y+2..y+N
                               # when the live price comes back inside the entry_sanity_band
                               # (src/engine/strategy/retest.py, migration 0014).
                               # 5 = the variant the pre-registered entry-mechanism backtest
                               # returned under its own decision rule (N=1 and N=3 were measured and
                               # lost; other N were never run).
                               # OWNER-ONLY and NEVER learnable: this number IS the registered
                               # mechanism, so a learner moving it would be selecting an
                               # entry mechanism no study measured. It buys `brk20` no expectancy
                               # presumption (the study promoted no rule, on a survivorship-tainted
                               # eligible-universe proxy), no new
                               # entry price, no widened band and no new admission capacity — every
                               # re-publication faces the same prescreen caps and the same gate.
  regime_filter: true          # A crossing originates only when
                               # NIFTY 50 close > SMA50 > SMA50 20 sessions earlier, at the crossing
                               # session — where the regime study measured it, so the sweep applies it at origination
                               # and resting levels are not re-judged. Blocked crossings are
                               # journalled in brk20_regime_blocked. `false` + restart rolls it back.

# Pre-screen candidate-origination throttles (owner-tunable). Scanner PARAMETERS live in the
# learner-writable envelope_state, never here — these are coarse per-day caps only.
strategy:
  prescreen:
    # signal.candidate publications per trading day (SignalPreScreen). This cap protects the ANALYST
    # forward budget; set EQUAL to agents.yaml `intraday_analyst.prescreen_cap_per_day` deliberately —
    # one number, one meaning; if the forward cap moves this must move with it (no derivation).
    max_candidates_per_day: 48
    # Admission ORDER. `ranked` = the pre-screen admits a batch score-descending
    # and the analyst forward queue picks by per-strategy score quantile; `arrival` = first-come-first-served.
    # `arrival` is the documented ROLLBACK setting and nothing else.
    admission_mode: ranked
    # Forward-queue DRAIN trigger. `paced` = the analyst slot is spent on a fixed
    # cadence (engine.ops.pipeline.FORWARD_PACING_MIN, 3 min) so candidates accumulate and the
    # ranking above actually chooses between them; `immediate` = inline drain, where the arriving
    # candidate is the only one pending and every slot goes in the first minutes of the session.
    # `immediate` is the documented ROLLBACK and nothing else.
    forward_drain_mode: paced
    # Per-strategy publication sub-caps [owner knob — NOT in the learnable envelope; the
    # learner may never move a cap that decides which strategies get evaluated at all].
    # `default` binds any strategy without its own line, and at 16 = 33% of max_candidates_per_day
    # it STRUCTURALLY prevents any single strategy — including one added later — from taking more
    # than a third of the day's slots. With rsi2 and mom parked the live sub-caps sum to 27 < 48,
    # so the sub-caps bind and the day cap is a backstop for a strategy on the default.
    # If orb is ever re-enabled, cap it near 7 = floor(TTL_INTRADAY_MIN 20 / FORWARD_PACING_MIN 3) + 1,
    # the largest burst the pacing can fully serve (expiry never re-arms the day slot), and diagnose
    # its saturated score (many fires at exactly 1.0, so ranked admission degenerates to emission order) first.
    max_per_strategy_day:
      default: 16
      orb: 0                     # parked: zero entry proposals from its analyst forwards; three
                                 # intraday price-only families refuted at retail cost (ORB 0/15 CPCV
                                 # twice, tdc, candle battery); re-enable only behind a
                                 # pre-registered intraday hypothesis that clears the cost floor.
                                 # 0 = admit nothing, charge no slot, one
                                 # prescreen_strategy_disabled line a day, and no arm levels in the
                                 # sweep verdict (a parked strategy can never arm).
      rsi2: 0                    # parked, on the orb park's terms: no registered edge and a null
                                 # target, so the cost gate can pass it only on a target the analyst
                                 # invents; it failed under next-open fills and the spread. It spent up
                                 # to 16 analyst forwards a day whenever the index regime was up.
      trend: 0                   # parked: no validated edge; re-enable only behind a
                                 # pre-registered hypothesis, on the orb park's terms.
      mom: 0                     # parked: it ships no stop, so the pipeline drops every candidate as
                                 # unsizeable before the analyst, and the slot stayed spent. Its rank is
                                 # a 20-session return over two names; the factor portfolio study tests
                                 # the diversified 12-month form.
      brk20: 12
      ins: 8                     # a rare, EOD-batch event — ~13-18 fresh
                                 # in-universe filings a day yield few crossings, so this is a
                                 # ceiling against a cluster day, not an expected daily draw.
      cat: 2                     # v2 shadow: = catalyst_guard
                                 # .max_catalyst_entries_day; measured flow ~0.3-0.6/day, so 2 is a
                                 # cluster-day ceiling. Binds even before the guard-side wiring.
      cat_reversal: 2            # Matches `cat`'s value: this
                                 # is a PRESCREEN admission slot budget (analyst spend), a different
                                 # and NON-shared budget from catalyst_guard.max_catalyst_entries_day
                                 # — which cat_reversal DOES share with `cat`, so the platform's total
                                 # news-originated entry ceiling stays 2/day with this strategy added.
                                 # Reversal rows are a strict SUBSET of originating rows, so the real
                                 # flow is well under `cat`'s; 2 is a ceiling, not an expectation.
      hi52: 3                    # 52wk-high-proximity
                                 # fresh-crosses over the ELIGIBLE universe. Fresh-cross-only plus
                                 # the v2 smooth/gap filters keeps natural flow to a handful/day; 3
                                 # caps analyst spend on a cluster day. Deliberately not widened — the
                                 # forward test measures the rule, not a wider
                                 # tap — and these candidates take REAL slots in the one ranked
                                 # batch admission (scores ~0.95-1.0 rank above brk20's ~0.5-0.6,
                                 # so this cap is what bounds the displacement they can do). It does
                                 # NOT get publication priority with them: ops.main
                                 # ._publication_order keeps hi52 last in the batch, so the analyst
                                 # forward slot's fired_at tie-break still goes to the validated legs.
    cap_release_schedule:        # Cumulative tranches by
      orb:                       # IST bar time; effective cap = min(max_per_strategy_day, tranche).
        "10:00": 3               # Absent/removed = flat caps (rollback).
        "11:30": 5               # INERT while orb is parked (min(0, tranche) = 0, and the park gate
        "13:00": 7               # refuses before the schedule is read); kept for the re-enable.
    # How much better a later candidate must score to take a full cap's admission slot from an
    # unevaluated or declined incumbent of the SAME strategy [owner knob — NOT in the learnable envelope,
    # same reason as max_per_strategy_day above: it decides which candidates get evaluated at all].
    #
    # Why the cap needed displacement at all, and what makes it safe: the module docstring of
    # src/engine/strategy/prescreen.py (the "Cap displacement" section).
    #
    # Why 0.10 rather than a bare "strictly higher":
    #   (i) scores are clamped to [0, 1], so strict inequality lets 0.801 evict 0.800 — a
    #       publication, a journal write and a discarded queue entry spent on noise, and an
    #       oscillation that a margin makes structurally impossible;
    #  (ii) 0.10 is a tenth of the clamped [0, 1] score range — the smallest gap that still names a
    #       materially better candidate rather than noise, and small enough that a real afternoon
    #       fire can clear it. Deliberately NOT tied to the forward ranker's quintile bands: those
    #       are EMPIRICAL rank quintiles of a strategy's own day, not fixed 0.2-wide slices of the
    #       score, so "one band" is not a score distance and there is no equivalence to borrow.
    # Compared in integer basis points, never float arithmetic: 0.90 - 0.80 is 0.09999999999999998
    # in IEEE-754, which would make this boundary depend on representation rather than on the rule.
    # Raising it makes displacement rarer; `null` disables it entirely (the rollback).
    # NOTE: a saturated score (many fires at exactly 1.0) leaves equal incumbents undisplaceable at
    # ANY margin — so this knob cannot rescue a saturated strategy.
    displacement_margin: 0.10

# ReconcileJob drift thresholds [tunable]: alert when >max_bad_bar_fraction of compared
# bars drift by >vol_drift_pct volume or >close_drift_ticks ticks on close. Offline spans are
# gap-backfilled and EXCLUDED from the denominator — never counted as drift.
reconcile:
  vol_drift_pct: 2.0
  close_drift_ticks: 1
  max_bad_bar_fraction: 0.01

# BackfillJob pacing + Kite historical per-request range caps.
backfill:
  req_per_s: 3                   # dry-run wall-time ESTIMATE only (scripts/backfill.py); real pacing is
                                 # broker/rate_limiter.py _HISTORICAL_RATE_PER_S, not this key
  minute_chunk_days: 60          # max span per minute-interval historical request
  day_chunk_days: 2000           # max span per day-interval historical request

# UniverseBuilder inputs. The NSE list fetch is best-effort; the seed CSV is the
# offline fallback so universe build never hard-depends on an NSE page. The index is CONFIG, not a
# constant. The retired nifty200_* keys have NO aliases — UniverseCfg forbids extras, so a stale
# settings.yaml fails loudly at boot instead of quietly presenting the wrong universe as live.
# The eligible index is NIFTY Total Market (~750 = NIFTY 500 + Microcap 250); the CORE
# index (NIFTY 500) marks the evidence population - hi52 / ins / cat / cat_reversal originate, and the
# rec-outcome benchmark averages, over the core subset of the eligible set only. Rollback: put the
# NIFTY 500 values in the index_* keys (core_* identical => every index member is core).
universe:
  index_name: "NIFTY Total Market"         # logged on universe_built; named in the fallback alert
  index_source_url: "https://archives.nseindia.com/content/indices/ind_niftytotalmarket_list.csv"
  index_seed_path: "config/universe/niftytotalmarket_seed.csv"   # nifty500_seed.csv is now the CORE seed
  core_index_name: "NIFTY 500"
  core_index_source_url: "https://archives.nseindia.com/content/indices/ind_nifty500list.csv"
  core_index_seed_path: "config/universe/nifty500_seed.csv"

# Scheduler fire-times (IST, trading days). Fire-times only — every job is also
# catch-up-eligible on the next startup if its fire-time passed while the engine was off.
# isin_map, results_line_items and feed_freshness are not listed: they fire at their JobTimesCfg
# defaults (src/engine/core/config.py).
jobs:
  instruments_ist: "08:15"
  surveillance_ist: "08:20"
  universe_build_ist: "08:30"    # UniverseBuilder
  catalyst_digest_ist: "08:35"
  preopen_planner_ist: "08:50"   # pre-open planner
  time_exit_check_ist: "09:30"   # time exit
  reconcile_ist: "15:50"
  bhavcopy_ist: "18:00"
  corp_actions_ist: "20:15"      # after NSE's ~18:15-19:00 maintenance window (404s inside it)
  earnings_ist: "18:30"
  rec_outcomes_ist: "18:30"      # hindsight rec scoring — after daily_bars (18:05)
  signal_outcomes_ist: "18:40"   # hindsight signal scoring — after rec_outcomes' EW returns
  weekly_summary_ist: "19:00"    # weekly owner summary — after rec_outcomes
  deals_ist: "20:30"             # flagged_instrument_days — after NSE's maintenance window
                                 # (as corp_actions); before the 21:00 backup
  filings_pit_ist: "18:35"       # filings_pit — insider trades (NSE PIT, historical; date-keyed)
  filings_pit_fresh_ist: "19:00" # filings_pit_fresh — BSE fresh insider, same-day (date-keyed)
  ins_crossings_ist: "19:15"     # ins_crossings — EOD insider net-buy crossing detection
                                 # (date-keyed). MUST stay AFTER filings_pit_fresh (19:00): it reads
                                 # the same-day BSE rows that job ingests. Its catch-up `order` (66)
                                 # enforces the same dependency when a missed day is replayed.
  filings_results_ist: "18:45"   # filings_results — results + board-meeting dates (date-keyed)
  filings_shp_ist: "18:50"       # filings_shp — SHP + pledge (run-latest)
  nightly_review_ist: "21:00"
  backup_ist: "21:00"            # (watermark-driven, not pinned to being up at 21:00)
  sector_map_weekly_day: "SUN"   # (sector_map + theme_map weekly refresh). NOT read by code:
                                 # the Sunday cadence is hard-coded (ops.main._is_sunday + its CronTrigger)

auth:
  totp_automation:
    # OWNER-ACCEPTED RISK ITEM: scripted TOTP auto-login violates Zerodha policy
    # (account/API suspension risk). Default OFF; enabling is an explicit owner act.
    enabled: false               # RESERVED: no code reads this key; flipping it has no effect

feature_flags:
  paper_only: true                        # no live order routing possible
  onedrive_backup_mirror: false           # Owner choice. RESERVED: no code reads it; true does nothing
