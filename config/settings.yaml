# config/settings.yaml — non-secret runtime config (paths, ports, schedules, feature flags).
#
# NOT a protected store. Secrets are NEVER here (they live in Windows Credential Manager, R10).
# The trade_window below is only the SEED default; the live value is sticky in SQLite
# `trade_window_state` and owner-adjustable at runtime (§3.2.7/§7.1).

schema_version: 1
env: dev                                  # dev | prod (overridable via MT_ENV)
timezone: "Asia/Kolkata"                  # IST always; all scheduling tz-aware (R6)

paths:
  data_dir: "data"                        # overridable via MT_DATA_DIR
  duckdb: "data/market.duckdb"
  parquet_dir: "data/parquet"
  sqlite: "data/state.db"                 # WAL mode (§4.1)
  logs_dir: "data/logs"
  backups_dir: "data/backups"

api:
  host: "0.0.0.0"                         # binds LAN (R6 phone login redirect needs LAN reachability)
  port: 8400                              # dashboard + Kite login callback (§3.2.11)
  # GET /kite/callback is the ONLY unauthenticated route; everything else needs the bearer token (R10)

ticker:
  tcp_host: "127.0.0.1"                   # loopback only, not routable (§2.4 trust boundary)
  tcp_port: 8401                          # length-prefixed msgpack frames, 1 s heartbeat (§2.2)
  heartbeat_silence_kill_s: 10            # silence > 10 s => kill+respawn+stale-data guard (R2/A4)
  max_instruments_per_conn: 3000          # A3
  tick_silence_degrade_s: 120             # in-session tick silence (heartbeats OK) => DEGRADED + alert
  feed_stats_interval_s: 300              # periodic in-session feed_stats INFO line cadence
  warming_timeout_s: 60                   # WARMING with no heartbeat > this => kill+respawn (2026-07-23
                                          #   sleep/resume wedge; also the generic system-resume recovery)
  warming_backoff_cap_s: 300             # consecutive WARMING-timeout respawns back off (60×2ⁿ), capped here
  max_wedge_respawns: 5                   # after this many consecutive wedge respawns => escalate ONCE (warning)
  keep_awake_in_session: true             # Windows: keep the OS awake while the NSE session is open (screen may sleep)

# Process-lifecycle notifications + liveness watchdog (§2.2/§3.2.12). Distinct from the ticker heartbeat above:
# this is the ENGINE's own liveness marker (SQLite engine_lifecycle.last_alive_at) read by the OUT-OF-BAND watchdog.
lifecycle:
  heartbeat_write_s: 20                   # engine writes last_alive_at this often (HealthMonitor)
  down_stale_s: 90                         # watchdog: intend_to_run true AND heartbeat older than this => ENGINE_DOWN
                                          #   (> 3× heartbeat_write_s so a single slow tick never false-alarms)
  watchdog_poll_s: 60                     # scripts/watchdog.py Scheduled-Task cadence (non-wake, §10.7)
  notify_planned_stop: true               # send ENGINE_STOPPED on a clean/planned stop (owner chose: notify both, 2026-07-07)
  notify_started: true                    # send ENGINE_STARTED immediately on boot
  active_period_starts: ["08:00"]         # expected active-period starts (IST); watchdog raises
                                          #   SCHEDULED_START_MISSED past start_grace_s (§2.6/§10.4)
  start_grace_s: 900                      # grace after an expected start before the missed-start alert
  catchup_grace_s: 900                    # §2.6 startup catch-up budget before FROZEN escalation alerts
  crashloop_window_s: 600                 # fast respawns inside this window => ENGINE_CRASHLOOP (§2.2/§10.7)

broker:
  kite_login_redirect_path: "/kite/callback"   # MUST match the Kite app registered redirect URL (R6)
  token_expiry_ist: "06:00"               # A5 [RE-VERIFY: A5 06:00 vs forum 07:30]; token_valid() is
                                          # driven off last successful call / 403s, NOT a hard clock
  instruments_refresh_ist: "08:15"        # daily dump (A10/A8)

# SEED default for the owner-set daily trade window (§7.1 trade_window). Live value is sticky in
# SQLite, owner-adjustable via /trade_window and POST /config/trade_window (§3.2.7).
trade_window:
  start_ist: "10:00"
  end_ist: "10:30"
  squareoff_buffer_min: 5                 # MIS entries cut off at end − buffer; force-flat by end (§3.2.8)

telegram:
  # The owner's Telegram chat ID (NOT a secret — just an integer ID). Inbound commands are accepted
  # ONLY from this chat ID (R10). The bot TOKEN is a secret (Credential Manager). 0 = not configured
  # yet (the engine starts without Telegram and warns).
  owner_chat_id: -5586756347

clock:
  ntp_servers: ["time.windows.com", "pool.ntp.org"]
  max_skew_s: 2                           # > 2 s => no new entries until resync (R6); mirrors limits.clock_skew

data:
  # A11 empirical answer (scripts/a11_check.py): are Kite minute candles corp-action adjusted?
  # RESOLVED 2026-07-05 -> true (ADJUSTED). Verified against the BSE 2:1 bonus (ex-date 2025-05-23,
  # factor R~3): Kite's historical minute pre-ex close 2338.5 ~= raw Rs 7015 / 3, continuous with the
  # ex-date open Rs 2358 (no raw jump); daily agrees (2332). So the backfill / bar-stitching job needs
  # NO re-adjustment of Kite minute history across ex-dates (A11). Recorded also in plan section 14 Q10.
  minute_candles_adjusted: true
  universe_max_watchlist: 200             # active intraday watchlist cap [tunable] (A3 not the binding constraint)
                                          # 50 -> 100 owner-directed 2026-08-04 (BPCL, liquidity rank 96,
                                          # was structurally invisible); 100 -> 200 owner-directed 2026-08-20
                                          # (origination review: cap >= eligible set, watchlist_cap exclusion
                                          # now structurally empty - per-bar scanners see the full eligible
                                          # NIFTY200). First boot after a raise backfills 1m history for the
                                          # newly watched symbols (A2 throttled - longer warm-up that morning)
  min_median_traded_value_inr: 50000000   # ₹5cr median 20d traded value [tunable]
  backfill_daily_years: 2
  backfill_minute_years: 1

# --- News-intelligence layer (§2.7) — owner-only operational config; changes audited (config_audit) ---
news:
  # Feed set (§3.2.4 NewsIngest). `rss` is an open name -> {url, poll_s} map: one scheduler job per
  # entry, so adding/removing a source is a settings edit, not a code change. Headline-level only;
  # bodies never fetched. Moneycontrol RSS REMOVED 2026-08-04 — its whole feed ecosystem has been
  # frozen since ~2024-04 (probe 2026-08-04: newest pubDate ~832 days old; 391 engine polls inserted
  # 0 headlines ever), which left the corpus ET-only and made cat's min_source_domains:2 unpassable.
  feeds:
    rss:
      et:                                                                                    # verified live 2026-08-04
        url:    "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
        poll_s: 300                                                                          # 5-min cadence (§3.2.4)
      livemint_markets:                                                                      # verified live 2026-08-04 (HTTP 200, 35 items, newest 11 min old)
        url:    "https://www.livemint.com/rss/markets"
        poll_s: 900                                                                          # 15-min, polite
      livemint_companies:                                                                    # verified live 2026-08-04 (HTTP 200, 35 items, newest 31 min old)
        url:    "https://www.livemint.com/rss/companies"
        poll_s: 900                                                                          # 15-min, polite
      # 2026-08-05 pool widening (owner-directed): the corroboration pool was effectively TWO domains
      # (both livemint feeds are ONE domain), so min_source_domains:2 required the exact ET∩LM
      # intersection. Three new DOMAINS below take the pool to five — "any 2 of 5" is realistic for
      # genuine stories, unchanged bar for a manipulator. Probed live 2026-08-05; rejected same day:
      # financialexpress (malformed XML), zeebiz + business-standard (WAF 403), businesstoday (no dates).
      hbl_markets:                                                                           # verified live 2026-08-05 (60 items, newest 34 min)
        url:    "https://www.thehindubusinessline.com/markets/feeder/default.rss"
        poll_s: 900
      hbl_companies:                                                                         # verified live 2026-08-05 (60 items, newest 40 min)
        url:    "https://www.thehindubusinessline.com/companies/feeder/default.rss"
        poll_s: 900
      cnbctv18_market:                                                                       # verified live 2026-08-05 (200 items, newest 10 min)
        url:    "https://www.cnbctv18.com/commonfeeds/v1/cne/rss/market.xml"
        poll_s: 900
      ndtvprofit:                                                                            # verified live 2026-08-05 (20 items, newest 63 min)
        url:    "https://feeds.feedburner.com/ndtvprofit-latest"
        poll_s: 900
    gdelt_doc_query:  "sourcecountry:IN (markets OR stocks OR earnings OR NSE)"               # DOC 2.0 query [VERIFY Phase-1]
  cluster_sim_threshold: 0.75    # §3.2.4 pinned clustering similarity [tunable, owner] — drives the
                                 # corroboration count, so owner-only (never in envelope.yaml)
  gdelt_poll_s: 3600             # GDELT DOC 2.0 poll cadence — 1800→3600 (2026-08-04: the 429s persisted
                                 # at 30-min, and a probe of a SINGLE fresh request still 429'd, so the
                                 # limit is not cadence-shaped; O12 only needs the pre-open digest)
  request_timeout_s: 30          # per-fetch HTTP timeout — 10→30 (2026-08-04: 121 ConnectTimeouts against
                                 # GDELT at the old 10 s; ~99% of polls returned nothing)
  backfill_lookback_h: 72        # off-period startup headline backfill window (§4.4 job 10)
  gdelt_backfill_max_days: 90    # GDELT DOC ~3-month window — no deeper backfill dependency (E6)

cat:
  fanout_weight: 0.5             # §2.7 step 5: sector/theme fan-out multiplier on materiality AND |sentiment|
                                 # before threshold comparison. Owner-only, deliberately NOT learnable.
  max_event_age_days: 2          # §2.7 HeadlineClusterer near-duplicate assignment window + `cat` catalyst
                                 # age horizon (owner-only, NOT learnable; wired into HeadlineClusterer)
  # --- `cat` v2 SHADOW scanner knobs (§2.7 2026-08-18 amendment, WO-18). ins-mechanics mirror.
  # Deliberately NO expected_edge_pct: there is no validated edge (the shadow measures it), so the
  # §7.1 C3 gate fail-closed-rejects every cat candidate — signals are journalled at prescreen
  # admission, nothing reaches RECOMMEND. Adding the edge key is the §8.6 owner gate, post-verdict.
  stop_pct: 5.0                  # disaster stop; §7.1 overnight_gap_mult arithmetic (the ins 5% reasoning)
  hold_sessions: 20              # = the §7.1 swing max_holding cap; exit is TIME, target is None

# §2.8.4 corporate-filings event thresholds — OWNER-ONLY, deliberately NOT learnable (no new
# envelope-learnable parameters in stages 1–2). STORED CONFIG ONLY in stage 1: read by NO decision
# path yet (event typing §2.8.2 + catalyst wiring are later stages, gated on the §2.8.4 event study).
filings:
  insider_min_value_inr: 10000000    # abs ₹ floor for an insider_net_buy event (₹1cr, §2.8.2)
  insider_min_value_over_adv: 0.05   # AND value/20d-ADV floor (§2.8.2)
  pledge_delta_min_pct: 5.0          # QoQ promoter-pledge %-point change to flag (§2.8.2)

# §6.1 `ins` — insider net-BUY swing leg (owner-directed 2026-08-17, the first EVIDENCE-FIRST
# origination rule). OWNER-ONLY knobs, not in the learnable envelope (§6.3) for Phase 2.
#
# PROVENANCE (WO-16, 2026-08-14 — IMPROVEMENT_SPEC.md): the §2.8.4 insider_net_buy leg was re-run
# under corrected mechanics — DISCLOSURE-date anchoring (never the insider's transaction date),
# next-session-OPEN fills, the corrected spread-inclusive CNC cost surface, and the WO-3 margin floor
# on the CPCV stage — and SURVIVED: T+10 +0.7297% / T+20 +1.5797% net, CPCV +0.0359%/day with the
# median passing split 4x the margin floor. It is the ONLY recorded edge that survived, which is the
# whole reason this block exists.
#
# HONEST CAVEATS, carried not hidden (plan §6.1 `ins` addendum):
#   * Live crossings are computable only from the BSE FRESH feed (live 2026-07-19, ~13-18 in-universe
#     rows/day); NSE PIT's ~70-day content embargo makes it historical-only. The live-reachable event
#     population is NOT proven identical to the backtested one. The ins_crossings job logs fresh-feed
#     row counts every run — sustained zero-rows is STARVATION, not absence of signal.
#   * The CPCV pass is boundary-exact: 60.0% of folds against a 60% bar, one fold from failure.
#   * The survivorship / index-membership bound is uncorrectable with stored data.
ins:
  stop_pct: 5.0                # DISASTER stop, a deliberate deviation from the stopless validated
                               # design: §7.1 sizing needs a risk distance, so one must exist. Set to
                               # the WIDEST economically viable point (corrected 2026-08-17): the
                               # §7.1 overnight_gap_mult (2.5×) charges every swing unit 2.5× its
                               # stop distance, so notional ≈ ₹400/(2.5×stop%) and the DP flat charge
                               # makes WIDER stops WORSE — measured edge multiples: 4%→2.52× PASS,
                               # 5%→2.19× PASS, 6%→1.90× REJECT. Only [4-5] of the future [4-8]
                               # envelope range is viable at current capital/costs (plan §6.1).
  hold_sessions: 20            # = the §7.1 max_holding swing cap (limits.yaml swing_trading_days: 20)
                               # = exactly the validated T+20 horizon, so the EXISTING max-holding
                               # machinery IS the exit path. No new exit code exists for `ins`.
                               # FUTURE §6.3 envelope row [10-20] — static owner knob for Phase 2.
  threshold_inr: 10000000      # ₹1cr trailing-10-session open-market insider net-BUY floor.
                               # OWNER-FIXED and NEVER learnable: this threshold DEFINES the validated
                               # event population — moving it re-opens multiplicity.
  expected_edge_pct: 1.58      # the validated T+20 NET drift, fed to the C3 cost gate. `ins` ships
                               # target: None (the T+20 median +1.21% is INFORMATION, never an order
                               # level), so the gate cannot derive an edge from the levels — this is
                               # the per-strategy input it uses instead. At default sizing (2% swing
                               # risk / 6% stop ~ ₹6.7k notional) the CNC round trip is ~0.53% incl.
                               # the DP flat charge => edge multiple ~3x. The exact CostModel
                               # adjudicates per candidate; small notionals may be shrunk or rejected,
                               # and that is the gate doing its job.

# §3.2.5 pre-screen candidate-origination throttles (owner-tunable). Scanner PARAMETERS live in the
# learner-writable envelope_state (R4), never here — these are coarse per-day caps only.
strategy:
  prescreen:
    # signal.candidate publications per trading day (SignalPreScreen). 20→48 (2026-08-18): this cap
    # exists to protect the ANALYST forward budget, and that budget moved without it — agents.yaml
    # `intraday_analyst.prescreen_cap_per_day` went 6→12 (2026-08-11) →48 (2026-08-18, the ~5x
    # envelope raise, sized "to clear a 66-candidate morning") while this number sat at 20, unchanged
    # since Phase 1. Origination was therefore throttled 2.4x BELOW the thing it throttles for.
    # Observed live 2026-08-18: 20/20 slots spent by 10:10:49, then 2,549 refusals for the rest of
    # the session (47 distinct orb pairs at score >= 0.99) against 13 analyst calls and 0 proposals.
    # Set EQUAL to prescreen_cap_per_day deliberately — one number, one meaning; if the forward cap
    # moves again this must move with it (there is no derivation, only this comment).
    max_candidates_per_day: 48
    # Admission ORDER (WO-1, 2026-08-13). `ranked` = the pre-screen admits a batch score-descending
    # and the analyst forward queue picks by per-strategy score quantile; `arrival` = the pre-WO-1
    # first-come-first-served order. `arrival` is the documented ROLLBACK setting and nothing else.
    admission_mode: ranked
    # Forward-queue DRAIN trigger (2026-08-14). `paced` = the analyst slot is spent on a fixed
    # cadence (engine.ops.pipeline.FORWARD_PACING_MIN, 3 min) so candidates accumulate and the
    # ranking above actually chooses between them; `immediate` = the pre-2026-08-14 inline drain,
    # where the arriving candidate was the only one pending and all 12 slots went in the first five
    # minutes of the session (live 2026-08-14). `immediate` is the documented ROLLBACK and nothing
    # else.
    forward_drain_mode: paced
    # Per-strategy publication sub-caps [owner knob — NOT in the learnable envelope (§6.3); the
    # learner may never move a cap that decides which strategies get evaluated at all].
    # `default` binds any strategy without its own line, and at 16 = 33% of max_candidates_per_day
    # it STRUCTURALLY prevents any single strategy — including one added after this file was
    # written — from taking more than a third of the day's slots. orb is capped explicitly: on
    # 2026-08-11 it took 55% of the day's publications purely by firing first.
    # Rescaled with the day cap 2026-08-18 (20→48). The sub-caps SUM to 63 > 48, same shape as
    # before the rescale (36 > 20): the day cap is the aggregate bound, these decide the MIX.
    # orb is deliberately NOT scaled with the rest — two independent reasons:
    #   (i) drain physics: orb is the only intraday-style scanner, so its queued candidates carry
    #       TTL_INTRADAY_MIN (20 min) against FORWARD_PACING_MIN (3 min) — a simultaneous burst of
    #       N can drain at most ~7 before TTL expiry, and expiry never re-arms the day slot. A cap
    #       above 7 guarantees burned slots on a burst day, and orb IS bursty (it fires at
    #       range-completion). 7 = floor(20/3) + 1, the largest burst the pacing can fully serve.
    #   (ii) score quality: 2026-08-18 showed orb firing on 76 symbols with 883 fires at exactly
    #        score 1.0 — a SATURATED score, under which WO-1's ranked admission degenerates to
    #        emission order. Until that is diagnosed, more orb slots just buy first-come noise.
    max_per_strategy_day:
      default: 16
      orb: 7
      rsi2: 16
      trend: 10
      mom: 8
      brk20: 12
      ins: 8                     # §6.1 `ins` (2026-08-17): a rare, EOD-batch event — ~13-18 fresh
                                 # in-universe filings a day yield few crossings, so this is a
                                 # ceiling against a cluster day, not an expected daily draw (4→8
                                 # 2026-08-18 with the day cap; the expected draw is unchanged).
      cat: 2                     # §2.7 v2 shadow (2026-08-18, WO-18): = catalyst_guard
                                 # .max_catalyst_entries_day; measured flow ~0.3-0.6/day, so 2 is a
                                 # cluster-day ceiling. Binds even before the guard-side wiring.

# §3.2.3 ReconcileJob drift thresholds (A13) [tunable]: alert when >max_bad_bar_fraction of compared
# bars drift by >vol_drift_pct volume or >close_drift_ticks ticks on close. Offline spans are
# gap-backfilled and EXCLUDED from the denominator (§2.6) — never counted as drift.
reconcile:
  vol_drift_pct: 2.0
  close_drift_ticks: 1
  max_bad_bar_fraction: 0.01

# §3.2.3 BackfillJob pacing + Kite historical per-request range caps (A2).
backfill:
  req_per_s: 3                   # hard ≤3 req/s budget (A2), shared through broker.rate_limiter
  minute_chunk_days: 60          # max span per minute-interval historical request
  day_chunk_days: 2000           # max span per day-interval historical request

# §3.2.4 UniverseBuilder inputs (A8). The NSE list fetch is best-effort (E5); the seed CSV is the
# offline fallback so universe build never hard-depends on an NSE page.
universe:
  nifty200_source_url: "https://archives.nseindia.com/content/indices/ind_nifty200list.csv"  # [VERIFY Phase-1]
  nifty200_seed_path: "config/universe/nifty200_seed.csv"

# §10.1 scheduler fire-times (IST, trading days, R6). Fire-times only — every job is also §2.6
# catch-up-eligible on the next startup if its fire-time passed while the engine was off.
jobs:
  instruments_ist: "08:15"       # §4.4 job 4 (A10/A8)
  surveillance_ist: "08:20"      # §4.4 job 5 (A8)
  universe_build_ist: "08:30"    # §3.2.4 UniverseBuilder
  catalyst_digest_ist: "08:35"   # §4.4 job 14 (§2.7 step 5)
  preopen_planner_ist: "08:50"   # §5.3 pre-open planner
  reconcile_ist: "15:50"         # §4.4 job 2 (A13)
  bhavcopy_ist: "18:00"          # §4.4 job 6
  corp_actions_ist: "20:15"      # §4.4 job 7 (A12) — moved 18:15→20:15 (2026-07-24: three consecutive
                                 # evening 404s in NSE's ~18:15-19:00 maintenance window; morning
                                 # retries always succeeded, so the data exists — the TIME was wrong)
  earnings_ist: "18:30"          # §4.4 job 8 (R2)
  deals_ist: "20:30"             # §4.4 job 9 (flagged_instrument_days) — moved 18:45→20:30 (2026-07-24:
                                 # three consecutive evening 503s, same NSE maintenance window as
                                 # corp_actions; still before the 21:00 backup)
  filings_pit_ist: "18:35"       # §2.8 filings_pit — insider trades (NSE PIT, historical; date-keyed)
  filings_pit_fresh_ist: "19:00" # §2.8 filings_pit_fresh — BSE fresh insider, same-day (date-keyed)
  ins_crossings_ist: "19:15"     # §6.1 ins_crossings — EOD insider net-buy crossing detection
                                 # (date-keyed). MUST stay AFTER filings_pit_fresh (19:00): it reads
                                 # the same-day BSE rows that job ingests. Its catch-up `order` (66)
                                 # enforces the same dependency when a missed day is replayed.
  filings_results_ist: "18:45"   # §2.8 filings_results — results + board-meeting dates (date-keyed)
  filings_shp_ist: "18:50"       # §2.8 filings_shp — SHP + pledge (run-latest)
  nightly_review_ist: "21:00"    # §5.5/§6.4
  backup_ist: "21:00"            # §10.5 (watermark-driven, not pinned to being up at 21:00)
  sector_map_weekly_day: "SUN"   # §4.4 job 13 (sector_map + theme_map weekly refresh)

auth:
  totp_automation:
    # OWNER-ACCEPTED RISK ITEM (A5/§7.3): scripted TOTP auto-login violates Zerodha policy
    # (account/API suspension risk). Default OFF; enabling is an explicit owner act.
    enabled: false

feature_flags:
  paper_only: true                        # Phase 0–3: no live order routing possible
  onedrive_backup_mirror: false           # §14 Q8 owner choice
