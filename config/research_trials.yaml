# Research trial ledger: one entry per hypothesis family or variant the program has tested (engine.learning.multiplicity).
# Invariant (IMPLEMENTATION_PLAN §2): a new expected_edge_pct or promotion cites an entry here and clears the bar at N = family_trials.
trials:
  - id: "edge-orb-20260712"
    date: "2026-07-12"
    family: "edge/orb"
    hypothesis: "Opening-range breakout (orb-long) has positive net drift at retail cost"
    population: "200 symbols; windows 2024-01 to 2026-07"
    construct: "ORB entry; v1 ATR14 stop, v2 range-anchored stop; MIS round trip 0.106%"
    variants: 2
    result: "refuted"
    report: "data/reports/orb_sweep_20260712T033313.json"
