    population: "200 symbols; windows 2024-01 to 2026-07"
    construct: "ORB entry; an ATR14 stop or a range-anchored stop; MIS round trip 0.106%"
    variants: 2
    result: "refuted"
    report: "data/reports/orb_sweep_20260712T033313.json"
