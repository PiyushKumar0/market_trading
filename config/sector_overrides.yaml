# config/sector_overrides.yaml — owner-curated sector supplement (§4.4 job 13 sector_map).
#
# NOT a protected store (owner-editable operational config, like themes.yaml). The NSE
# sectoral-index constituent CSVs scraped by sector_map.py (SECTOR_SOURCES) are committee-curated
# indices, not a full industry taxonomy — some genuinely financial-sector companies are NOT
# constituents of any scraped index even though NSE's own "Industry" column (in the universe
# index CSVs) tags them Financial Services. Left unclassified, they'd land in UNCLASSIFIED and
# get capped at 1 open position by the risk gate (conservative, but loses sector context).
#
# Shape: overrides: {sector_name: [symbol, ...]}
#
# sector_name MUST be one of the SECTOR_SOURCES names in sector_map.py (e.g. FINANCIAL_SERVICES,
# BANK, PSU_BANK, ...). An unrecognized name is skipped at merge time — not applied, not a hard
# failure — with a warning alert; it does NOT reclassify its symbols out of UNCLASSIFIED.
#
# Applied AFTER index-scrape classification, as a supplement only (mapping.setdefault in
# sector_map.py): a symbol already classified by a real scraped index is NEVER touched — the
# pinned SECTOR_SOURCES first-wins order still governs for anything a real index actually claims.
# Applies identically whether the run's classification came from a fresh scrape or a reused
# frozen-cache fallback (§4.4 job 13 E5 failure model) — the merge happens after both paths.
#
# Same owner-approval convention as themes.yaml (§5.5/§6.3): entries here are owner-approved
# additions, not auto-generated by the weekly job.

schema_version: 1

overrides:
  FINANCIAL_SERVICES:
    # HDFC Asset Management Company Ltd. (HDFCAMC) — Industry="Financial Services" in
    # config/universe/nifty200_seed.csv, confirmed NOT a constituent of the real scraped Nifty
    # Financial Services index (data/datafeeds/sector_lists.json, as_of 2026-08-24): the index is
    # committee-curated and structurally excludes AMCs even though NSE tags the Industry column
    # Financial Services.
    - HDFCAMC
    # ICICI Prudential Asset Management Company Ltd. (ICICIAMC) — same pattern as HDFCAMC:
    # Industry="Financial Services" in the seed CSV, same confirmed absence from the scraped
    # index. The only other AMC in the then-current NIFTY200 universe (searched both the committed
    # seed and the live cached universe — at the time config/universe/nifty200_seed.csv and
    # data/universe/nifty200_cached.csv, since O15 2026-09-04 nifty500_seed.csv and
    # index_cached.csv — for "Asset Management"/"AMC"/RTA/depository/ratings/broking/exchange
    # Industry hits; no other AMC or RTA name found. NOT re-searched over the wider NIFTY 500.)
    - ICICIAMC

# NOTE (found, deliberately left OUT — flagging for an explicit owner call rather than guessing):
# Multi Commodity Exchange of India Ltd. (MCX) is also tagged Industry="Financial Services" in
# both universe CSVs and is ALSO not a constituent of the real scraped Nifty Financial Services
# index (same cache check as above). It is a commodity exchange, not an AMC/RTA — a different
# category from the AMC-folding decision this file was scoped to. BSE Ltd. (BSE), by contrast, IS
# a genuine constituent of the real scraped index, so it needs no override. Add MCX above if the
# owner decides exchanges should get the same treatment as AMCs.
