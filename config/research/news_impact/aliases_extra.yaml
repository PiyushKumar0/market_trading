# Research-only short-name aliases for the news impact study, frozen at its registration (sha256 pinned in
# scripts/news_impact_common.py; any edit, comments included, changes the digest and the study refuses).
#
# The engine's alias table holds mostly full legal names, so headlines that use the press's short names
# (Titan, Sun Pharma, HCLTech, Paytm) resolve to nothing. Each entry maps a name taken from the News Analyst's
# entities in A's and the excluded window's unresolved stock stories to the one NSE EQ symbol it denotes.
# Proposed per name by an LLM against NSE's EQ list of 2026-11-09, reviewed by the manager on 2026-11-11.
# Left out: subsidiaries, groups, foreign and unlisted companies, people, exchanges, brokerages cited as the
# source of a view, and short names that also mean something else. Built from headlines and NSE's list only.
# The trailing comment is the number of unresolved stories that carried the name, then the company.
# The engine's resolver does not read this file.
