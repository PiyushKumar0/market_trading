[project]
name = "market-trading"
version = "0.0.0"
description = "Personal single-user AI trading platform for Indian equities (NSE / Zerodha Kite Connect). See IMPLEMENTATION_PLAN.md."
readme = "README.md"
requires-python = ">=3.12"          # A4: pin ONE tested interpreter. River needs >=3.11; plan pins 3.12.x.
license = { text = "Proprietary - single-user, not for distribution (B5)" }
authors = [{ name = "Owner" }]

# Runtime dependencies. Versions are pinned here.
# Heavy analytics/LLM deps are present because the install smoke test (scripts/smoke_test.py)
# imports + minimally runs each of them under the service account.
dependencies = [
    # --- Broker / market data ---
    "kiteconnect==5.2.0",              # PyPI dist name is `kiteconnect` (repo is zerodha/pykiteconnect); pins autobahn[twisted]==19.11.2 + Twisted transitively (KiteTicker)
    "msgpack>=1.0",                    # length-prefixed ticker<->engine TCP frames
    # --- LLM — bundles the Claude Code CLI subprocess; pinned at implementation time ---
    "claude-agent-sdk>=0.2.97",
    # --- Storage ---
    "duckdb>=1.1",                     # bars / features / analytics
    # SQLite is stdlib; no dependency.
    # --- Learning / backtesting ---
    "river>=0.21",                     # online learning + drift detection (Python >=3.11)
    "vectorbt>=0.26",                  # vectorized parameter sweeps (Apache-2.0 + Commons Clause)
    "skfolio>=0.5",                    # CombinatorialPurgedCV (CPCV)
    # --- Config / validation ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-ulid>=2.2",               # platform-assigned ULID ids (proposals, orders, ...)
    # --- Owner I/O surfaces ---
    "python-telegram-bot>=21.0",      # two-way Telegram control plane
    "fastapi>=0.110",                 # dashboard API + Kite login callback
    "uvicorn[standard]>=0.29",
    # --- Ops / time discipline ---
    "APScheduler>=3.10,<4",           # AsyncIOScheduler, IST tz
    "ntplib>=0.4",                    # clock-skew check (Clock.check_skew)
    "keyring>=24.0",                  # Windows Credential Manager / DPAPI secrets
    "structlog>=24.1",                # structured logging (core.log)
    "httpx>=0.27",                    # async HTTP for data feeds (best-effort)
    "tenacity>=8.2",                  # bounded retry/backoff helpers (rate-limit budget)
    "tzdata>=2024.1",                 # IANA tz DB — REQUIRED on Windows (zoneinfo has no system DB)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",              # parallel gate: pytest -n 8 --dist loadfile
    "hypothesis>=6.100",              # property tests for the OMS state machine
    "freezegun>=1.4",                 # deterministic Clock in tests
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mt-engine = "engine.ops.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv]
# Pin the interpreter via .python-version (3.12.x). `uv python install 3.12` fetches it.
package = true

[tool.pytest.ini_options]
# tests/offline (research, backtest and one-off scripts, and the modules only they use) is left out
# on purpose: it runs on demand with `pytest tests/offline`.
testpaths = ["tests/unit", "tests/chaos", "tests/replay", "tests/property"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "needs_heavy_deps: requires pykiteconnect/claude-agent-sdk/vectorbt/skfolio/river (smoke-test tier)",
    "chaos: plan §9.4 chaos suite (tests/chaos) — run weekly and before every phase gate: pytest -m chaos",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # line length handled by formatter; long fact-sheet comments are intentional

[tool.mypy]
python_version = "3.12"
packages = ["engine"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = false
